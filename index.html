<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<meta name="description" content="Futbol Mezatı — gerçek futbolcularla 11'e 11 açık artırma ve maç simülasyonu." />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<title>Futbol Mezatı</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");

:root {
  --bg: #0b0d12;
  --bg-soft: #11141b;
  --panel: #151922;
  --panel-2: #1a1f2a;
  --line: #262c38;
  --text: #eef1f6;
  --muted: #9aa3b2;
  --muted-2: #6b7482;
  --green: #22c55e;
  --green-d: #16a34a;
  --gold: #f5b942;
  --red: #ef4444;
  --blue: #60a5fa;
  --radius: 16px;
  --shadow: 0 18px 50px rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }

html, body, #root { min-height: 100%; }

body {
  margin: 0;
  background:
    radial-gradient(1100px 600px at 12% -10%, rgba(34, 197, 94, .10), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(99, 102, 241, .08), transparent 50%),
    var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; }

.app { min-height: 100vh; display: flex; flex-direction: column; }

/* ── Üst bar ──────────────────────────────────────────────── */
.topbar {
  height: 66px;
  padding: 0 clamp(16px, 4vw, 48px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px solid var(--line);
  background: rgba(11, 13, 18, .8);
  backdrop-filter: blur(14px);
  position: sticky;
  top: 0;
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.brand__mark {
  width: 34px; height: 34px; border-radius: 10px;
  display: grid; place-items: center; font-size: 18px;
  background: linear-gradient(145deg, var(--green), var(--green-d));
  box-shadow: 0 6px 18px rgba(34, 197, 94, .35);
}
.brand__name { font-weight: 900; font-size: 16px; letter-spacing: .04em; }
.brand__name span { color: var(--green); }
.topnav { display: flex; gap: 6px; }
.topnav span {
  font-size: 12px; font-weight: 600; color: var(--muted-2);
  padding: 8px 12px; border-radius: 8px; white-space: nowrap;
}
.topnav span.active { color: var(--text); background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); }
.topbar__badge {
  font-size: 12px; font-weight: 700; color: var(--muted);
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap;
}

.main { flex: 1; width: 100%; }
.screen { max-width: 1220px; margin: 0 auto; padding: clamp(20px, 4vw, 44px) clamp(16px, 4vw, 40px) 60px; }

.footer {
  text-align: center; color: var(--muted-2); font-size: 11px;
  padding: 18px; border-top: 1px solid var(--line);
}

.eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: .18em;
  color: var(--green); text-transform: uppercase;
}

/* ── Ortak bileşenler ─────────────────────────────────────── */
.panel {
  background: linear-gradient(180deg, var(--panel), var(--bg-soft));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}
.panel__title {
  margin: 0 0 16px; font-size: 12px; font-weight: 800;
  letter-spacing: .14em; color: var(--muted); text-transform: uppercase;
}
.btn {
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  border-radius: 12px;
  padding: 12px 18px;
  font-weight: 700; font-size: 14px;
  cursor: pointer;
  transition: transform .12s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-2px); border-color: #3a4353; }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn--primary {
  background: linear-gradient(145deg, var(--green), var(--green-d));
  border-color: transparent; color: #05130a;
  box-shadow: 0 10px 28px rgba(34, 197, 94, .3);
}
.btn--primary:hover:not(:disabled) { box-shadow: 0 14px 34px rgba(34, 197, 94, .45); }
.btn--hero { padding: 16px 34px; font-size: 15px; font-weight: 900; letter-spacing: .03em; border-radius: 14px; }
.btn--hero span { margin-left: 8px; }

/* ── Kurulum ──────────────────────────────────────────────── */
.setup { display: flex; flex-direction: column; gap: 34px; }
.hero { text-align: center; padding: 24px 0 6px; }
.hero__kicker { font-size: 12px; letter-spacing: .3em; color: var(--green); font-weight: 800; }
.hero__title {
  margin: 14px 0 12px; font-size: clamp(44px, 9vw, 88px); line-height: .95;
  font-weight: 900; letter-spacing: -.04em;
}
.hero__title span {
  background: linear-gradient(100deg, var(--green), #86efac 45%, var(--gold));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero__sub { max-width: 640px; margin: 0 auto 26px; color: var(--muted); line-height: 1.7; font-size: 15px; }
.setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.rules { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.9; font-size: 14px; }
.rules li { margin-bottom: 6px; }
.rules b { color: var(--text); }
.diffs { display: flex; flex-direction: column; gap: 10px; }
.diff {
  text-align: left; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 16px; cursor: pointer; color: var(--text);
  display: flex; flex-direction: column; gap: 3px; transition: .15s ease;
}
.diff:hover { border-color: #3a4353; }
.diff--active { border-color: var(--green); background: rgba(34, 197, 94, .1); box-shadow: inset 0 0 0 1px var(--green); }
.diff__label { font-weight: 800; }
.diff__desc { font-size: 12px; color: var(--muted); }
.setup-note {
  margin-top: 16px; padding: 12px 14px; border-radius: 10px;
  background: rgba(96, 165, 250, .07); border: 1px solid rgba(96, 165, 250, .18);
  color: var(--muted); font-size: 12px; line-height: 1.6;
}
.setup-note__icon { margin-right: 6px; }

.setting-label {
  font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted-2); margin: 18px 0 8px;
}
.mode-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode {
  display: flex; align-items: center; gap: 10px; text-align: left;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; cursor: pointer; color: var(--text); transition: .15s ease;
}
.mode:hover { border-color: #3a4353; }
.mode--active { border-color: var(--green); background: rgba(34, 197, 94, .1); box-shadow: inset 0 0 0 1px var(--green); }
.mode__icon { font-size: 22px; }
.mode b { display: block; font-size: 13px; font-weight: 800; }
.mode small { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; line-height: 1.35; }

.budget-value {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-soft); border: 1px solid var(--line); border-radius: 12px;
  padding: 6px 14px; margin-bottom: 12px;
}
.budget-value > span { color: var(--gold); font-size: 20px; font-weight: 900; }
.budget-value input {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
  color: var(--text); font-size: 26px; font-weight: 900; letter-spacing: -.02em;
  font-family: inherit;
}
.budget-value input::-webkit-inner-spin-button { opacity: .4; }
.budget-range { width: 100%; accent-color: var(--green); cursor: pointer; margin: 4px 0 12px; }
.budget-presets { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
  border-radius: 999px; padding: 6px 11px; font-size: 11px; font-weight: 800; cursor: pointer;
  transition: .15s ease;
}
.chip:hover { border-color: #3a4353; color: var(--text); }
.chip--active { border-color: var(--green); color: var(--green); background: rgba(34, 197, 94, .12); }
.budget-hint { margin-top: 12px; font-size: 11px; color: var(--muted-2); }
.bid-hint--handoff { color: var(--gold); margin-bottom: 4px; }
.bid-hint--handoff b { color: var(--gold); }

/* ── Portre / kart ────────────────────────────────────────── */
.portrait { position: relative; overflow: hidden; background: #0e1117; border-radius: 12px; flex-shrink: 0; }
.portrait--sm { width: 34px; height: 40px; border-radius: 8px; }
.portrait--md { width: 92px; height: 116px; }
.portrait--lg { width: 150px; height: 186px; border-radius: 14px; }
.portrait img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
.portrait__fallback { width: 100%; height: 100%; display: grid; place-items: center; position: relative; overflow: hidden; }
.portrait__initials { font-size: 34px; font-weight: 900; color: rgba(255, 255, 255, .88); letter-spacing: -.03em; }
.portrait--sm .portrait__initials { font-size: 13px; }
.portrait--md .portrait__initials { font-size: 26px; }
.portrait__shine {
  position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, .18), transparent 55%);
}
.portrait__fade {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, transparent 55%, rgba(0, 0, 0, .5));
}
.pos-badge {
  position: absolute; bottom: 6px; left: 6px; z-index: 2;
  font-size: 9px; font-weight: 900; letter-spacing: .05em;
  padding: 3px 6px; border-radius: 5px; color: #06120a; background: var(--green);
}
.pos-badge--GK { background: var(--gold); }
.pos-badge--DF { background: var(--blue); }
.pos-badge--MF { background: #a78bfa; }
.pos-badge--FW { background: var(--green); }
.pos-badge--sm { font-size: 8px; padding: 2px 4px; }
.portrait__flag { position: absolute; top: 5px; right: 5px; z-index: 2; font-size: 13px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }

.player-card {
  display: flex; gap: 18px; padding: 18px; border-radius: var(--radius);
  background: linear-gradient(120deg, rgba(34, 197, 94, .08), transparent 45%), var(--panel);
  border: 1px solid var(--line); position: relative; overflow: hidden;
}
.player-card--highlight { border-color: rgba(34, 197, 94, .5); box-shadow: 0 0 0 1px rgba(34, 197, 94, .25), 0 20px 60px rgba(0,0,0,.5); }
.player-card__media { position: relative; }
.player-card__ovr {
  position: absolute; top: -8px; left: -8px; z-index: 3;
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 30% 25%, #2f3a2f, #0e120e);
  border: 2px solid var(--green); color: var(--green);
  font-weight: 900; font-size: 17px; box-shadow: 0 6px 18px rgba(0,0,0,.5);
}
.player-card__body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.player-card__name { font-size: clamp(20px, 3vw, 30px); font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.player-card__meta { margin-top: 7px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.player-card__meta .dot { color: var(--muted-2); }
.player-card__club {
  margin-top: 9px; display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap;
  background: rgba(96, 165, 250, .08); border: 1px solid rgba(96, 165, 250, .2);
  border-radius: 9px; padding: 6px 10px; align-self: flex-start;
}
.club-icon { font-size: 12px; }
.club-name { font-size: 12px; font-weight: 800; color: #d6e8ff; }
.club-league {
  font-size: 9px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  color: var(--blue); border-left: 1px solid rgba(96, 165, 250, .35); padding-left: 7px;
}
.auto-badge {
  font-size: 8px; font-weight: 900; letter-spacing: .08em; padding: 3px 6px; border-radius: 5px;
  background: var(--gold); color: #241a05;
}
.player-card--compact .auto-badge { font-size: 7px; padding: 2px 4px; }
.stat-grid { margin-top: auto; padding-top: 18px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 22px; }
.stat { display: grid; grid-template-columns: 30px 1fr 26px; align-items: center; gap: 8px; }
.stat__label { font-size: 10px; font-weight: 800; color: var(--muted-2); }
.stat__bar { height: 6px; background: #0c0f14; border-radius: 4px; overflow: hidden; }
.stat__fill { display: block; height: 100%; border-radius: 4px; background: var(--muted-2); }
.stat__fill[data-level="good"] { background: var(--blue); }
.stat__fill[data-level="elite"] { background: linear-gradient(90deg, var(--green), #86efac); }
.stat__value { font-size: 11px; font-weight: 800; text-align: right; color: var(--text); }
.player-card__price {
  margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.price-label { font-size: 10px; letter-spacing: .12em; color: var(--muted); font-weight: 800; }
.price-value { font-size: 24px; font-weight: 900; color: var(--gold); }
.player-card--compact { padding: 10px; gap: 10px; align-items: center; background: var(--panel); }
.player-card--compact .player-card__name { font-size: 13px; font-weight: 800; }
.player-card--compact .player-card__meta { font-size: 10px; }
.player-card--compact .player-card__ovr { width: 32px; height: 32px; font-size: 12px; top: -6px; left: -6px; }
.player-card--compact .player-card__club { margin-top: 5px; padding: 3px 7px; gap: 4px; }
.player-card--compact .club-icon, .player-card--compact .club-league { display: none; }
.player-card--compact .club-name { font-size: 10px; }

/* ── Mezat ────────────────────────────────────────────────── */
.auction-top { margin-bottom: 18px; }
.auction-progress { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.lot-counter { font-size: 12px; font-weight: 800; color: var(--muted); }
.progress-track { height: 5px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.progress-track span { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--gold)); transition: width .4s ease; }
.auction-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
.auction-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.lot-stage { position: relative; }
.lot-stage__glow {
  position: absolute; inset: -20px 10% 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(34, 197, 94, .16), transparent 70%);
  filter: blur(30px);
}
.lot-stage .player-card { z-index: 1; }
.lot-banner {
  position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; gap: 14px;
  background: rgba(9, 12, 16, .82); backdrop-filter: blur(6px); border-radius: var(--radius);
  border: 1px solid var(--green); animation: pop .25s ease;
}
.lot-banner--ai { border-color: var(--blue); }
.lot-banner--none { border-color: var(--muted-2); }
.lot-banner__icon { font-size: 34px; }
.lot-banner b { display: block; font-size: 22px; font-weight: 900; }
.lot-banner span:not(.lot-banner__icon) { color: var(--muted); font-size: 13px; }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

.bid-panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.bid-status { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.turn-pill { font-size: 11px; font-weight: 900; letter-spacing: .08em; padding: 7px 12px; border-radius: 999px; }
.turn-pill--you { color: var(--green); background: rgba(34, 197, 94, .12); box-shadow: inset 0 0 0 1px rgba(34, 197, 94, .35); }
.turn-pill--ai { color: var(--blue); background: rgba(96, 165, 250, .12); box-shadow: inset 0 0 0 1px rgba(96, 165, 250, .35); }
.current-bid { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.current-bid__label { font-size: 10px; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
.current-bid__value { font-size: 30px; font-weight: 900; color: var(--gold); letter-spacing: -.02em; }
.current-bid__value small { font-size: 15px; margin-left: 1px; }
.current-bid__leader { font-size: 11px; color: var(--muted); }
.current-bid__leader.is-you { color: var(--green); }
.current-bid__leader.is-ai { color: var(--blue); }
.bid-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
.btn--bid { display: flex; flex-direction: column; gap: 2px; align-items: center; background: rgba(34, 197, 94, .1); border-color: rgba(34, 197, 94, .35); }
.btn--bid:hover:not(:disabled) { background: rgba(34, 197, 94, .2); border-color: var(--green); }
.btn--bid small { font-size: 10px; color: var(--muted); font-weight: 600; }
.btn--pass { background: transparent; color: var(--muted); }
.custom-bid {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 12px; padding: 12px; border-radius: 12px;
  background: rgba(245, 185, 66, .05); border: 1px solid rgba(245, 185, 66, .2);
}
.custom-bid__label {
  font-size: 10px; font-weight: 900; letter-spacing: .1em; color: var(--gold); white-space: nowrap;
}
.custom-bid__field {
  display: flex; align-items: center; gap: 5px; flex: 1; min-width: 130px;
  background: var(--bg-soft); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px;
}
.custom-bid__field > span { color: var(--gold); font-weight: 900; font-size: 14px; }
.custom-bid__field input {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
  color: var(--text); font-family: inherit; font-size: 16px; font-weight: 800;
}
.btn--bid-custom {
  background: rgba(245, 185, 66, .14); border-color: rgba(245, 185, 66, .45);
  color: var(--gold); padding: 10px 16px; white-space: nowrap;
}
.btn--bid-custom:hover:not(:disabled) { background: rgba(245, 185, 66, .25); border-color: var(--gold); }
.custom-bid__range { font-size: 10px; color: var(--muted-2); white-space: nowrap; }
.bid-hint { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }
.bid-hint b { color: var(--text); }

.auction-side { display: flex; flex-direction: column; gap: 14px; }
.squad-mini__head { display: flex; align-items: center; justify-content: space-between; }
.squad-mini__ovr { font-size: 11px; font-weight: 800; color: var(--green); }
.squad-mini--ai .squad-mini__ovr { color: var(--blue); }
.squad-mini__players { display: flex; gap: 6px; flex-wrap: wrap; }
.squad-chip {
  position: relative; width: 34px; height: 40px; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--line); background: var(--panel-2); flex-shrink: 0;
}
.squad-chip--empty { display: grid; place-items: center; color: var(--muted-2); font-size: 14px; border-style: dashed; }
.squad-chip__name {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
  font-size: 8px; font-weight: 800; text-align: center; padding: 1px;
  background: linear-gradient(transparent, rgba(0,0,0,.85)); white-space: nowrap; overflow: hidden;
}
.squad-chip__ovr { position: absolute; top: 1px; left: 1px; z-index: 2; font-size: 9px; font-weight: 900; color: var(--gold); text-shadow: 0 1px 2px #000; }
.squad-mini__budget { margin-top: 12px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
.squad-mini__budget b { color: var(--gold); }
.log-panel { flex: 1; }
.log-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
.log-item {
  font-size: 11px; line-height: 1.45; color: var(--muted);
  padding: 7px 9px; border-radius: 8px; background: rgba(255,255,255,.025);
  border-left: 2px solid var(--line);
}
.log-item--you { border-left-color: var(--green); color: #d8f7e2; }
.log-item--ai { border-left-color: var(--blue); color: #d8e8fb; }
.log-item--sys { border-left-color: var(--gold); }

/* ── Kadrolar ─────────────────────────────────────────────── */
.ready { display: flex; flex-direction: column; gap: 26px; }
.ready-head { text-align: center; }
.ready-head h1 { font-size: clamp(30px, 5vw, 50px); font-weight: 900; margin: 10px 0; letter-spacing: -.03em; }
.ready-head p { color: var(--muted); margin: 0 auto 22px; max-width: 560px; font-size: 14px; }
.coverage-note {
  display: inline-block; margin: -8px auto 18px; padding: 8px 14px; border-radius: 9px;
  background: rgba(245, 185, 66, .1); border: 1px solid rgba(245, 185, 66, .3);
  color: var(--gold); font-size: 12px;
}
.coverage-note b { color: var(--gold); }
.ready-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.ready-team__head { display: flex; align-items: center; justify-content: space-between; }
.ready-team__score { display: flex; align-items: baseline; gap: 8px; }
.ready-team__score span { font-size: 10px; color: var(--muted); font-weight: 800; letter-spacing: .1em; }
.ready-team__score b { font-size: 30px; font-weight: 900; color: var(--green); }
.ready-team--ai .ready-team__score b { color: var(--blue); }
.ready-team__stats { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 14px; }
.ready-team__stats span { font-size: 11px; color: var(--muted); }
.ready-team__stats b { color: var(--text); }
.ready-team__cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 8px; }

/* ── Maç sonucu ───────────────────────────────────────────── */
.match { display: flex; flex-direction: column; gap: 22px; }
.match-head { text-align: center; }
.match-head h1 { font-size: clamp(34px, 6vw, 58px); font-weight: 900; margin: 8px 0 0; letter-spacing: -.03em; background: linear-gradient(100deg, var(--green), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.scoreboard {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
  background: radial-gradient(ellipse at center, rgba(34,197,94,.1), transparent 70%), var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow);
}
.scoreboard__team { display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: .65; }
.scoreboard__team.is-winner { opacity: 1; }
.scoreboard__crest {
  width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
  font-size: 26px; font-weight: 900; color: #06120a;
  background: linear-gradient(145deg, var(--green), var(--green-d));
}
.scoreboard__crest--ai { background: linear-gradient(145deg, var(--blue), #3b82f6); color: #061020; }
.scoreboard__name { font-size: 20px; font-weight: 900; }
.scoreboard__tag { font-size: 10px; letter-spacing: .14em; color: var(--muted); font-weight: 800; }
.scoreboard__center { text-align: center; }
.scoreboard__score { display: flex; align-items: center; gap: 14px; font-size: clamp(48px, 9vw, 76px); font-weight: 900; letter-spacing: -.05em; line-height: 1; }
.scoreboard__score i { font-style: normal; color: var(--muted-2); font-size: 40px; }
.scoreboard__score .win { color: var(--green); }
.scoreboard__pen { margin-top: 8px; font-size: 13px; font-weight: 800; color: var(--gold); }
.scoreboard__full { margin-top: 10px; font-size: 10px; letter-spacing: .18em; color: var(--muted); font-weight: 800; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.compare { margin-bottom: 14px; }
.compare__row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 12px; }
.compare__row span { color: var(--muted); font-weight: 600; }
.compare__row b { font-size: 13px; }
.compare__bars { display: flex; height: 7px; gap: 3px; }
.compare__bars > div { border-radius: 4px; transition: width .5s ease; }
.compare__home { background: var(--green); }
.compare__away { background: var(--blue); }
.scorers { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line); }
.scorers > div { display: flex; flex-direction: column; gap: 5px; }
.scorers b { font-size: 12px; margin-bottom: 2px; }
.scorers span { font-size: 12px; color: var(--green); }
.scorers .muted { color: var(--muted-2); }
.event-list { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 4px; }
.event { display: flex; gap: 12px; padding: 9px 10px; border-radius: 8px; font-size: 12px; line-height: 1.45; background: rgba(255,255,255,.02); color: var(--muted); }
.event__min { font-weight: 900; color: var(--muted-2); min-width: 26px; }
.event--goal { background: rgba(34,197,94,.1); color: #d8f7e2; }
.event--goal .event__min { color: var(--green); }
.event--save { background: rgba(96,165,250,.07); }
.match-lineups { }
.lineup { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.lineup__team > b { font-size: 13px; }
.lineup__team--you > b { color: var(--green); }
.lineup__players { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.lineup__player { display: flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 7px 3px 3px; }
.lineup__player span { font-size: 11px; font-weight: 700; }
.match-footer { text-align: center; }

/* ── Duyarlılık ───────────────────────────────────────────── */
@media (max-width: 980px) {
  .auction-layout { grid-template-columns: 1fr; }
  .auction-side { flex-direction: row; flex-wrap: wrap; }
  .auction-side > * { flex: 1 1 240px; }
  .setup-grid, .ready-grid, .match-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .topnav { display: none; }
  .portrait--lg { width: 116px; height: 150px; }
  .player-card { gap: 12px; padding: 12px; }
  .stat-grid { grid-template-columns: 1fr; gap: 6px; }
  .bid-actions { grid-template-columns: repeat(2, 1fr); }
  .lineup { grid-template-columns: 1fr; }
  .ready-team__cards { grid-template-columns: 1fr 1fr; }
}

</style>
